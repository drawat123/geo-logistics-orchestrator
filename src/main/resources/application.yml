spring:
  application:
    name: "geo-logistics-orchestrator"
  datasource:
    url: jdbc:postgresql://localhost:5432/geologistics_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: true

logging:
  level:
    org:
      hibernate:
        orm:
          jdbc:
            bind: TRACE

jwt:
  secret: "sL8y90SuoGrepH9FXWz4sc9eQaubSbIqnGGxw6ZMHLk"
  expirationMs: 900000

cors:
  allowed-origins: "http://localhost:63342,https://myapp.com"

# --- Actuator Configuration ---
management:
  endpoints:
    web:
      exposure:
        # Expose specific endpoints via HTTP
        include: "health,info,metrics,loggers"
  endpoint:
    health:
      # Show full details for health (e.g., Disk space, DB connection status)
      show-details: always
  info:
    env:
      # Enable info endpoint
      enabled: true