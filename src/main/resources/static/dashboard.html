<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeoLogistics Live Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.6.1/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>

    <style>
        .status-dot {
            height: 10px;
            width: 10px;
            background-color: #bbb;
            border-radius: 50%;
            display: inline-block;
        }

        .status-connected {
            background-color: #28a745;
        }

        .status-error {
            background-color: #dc3545;
        }

        .order-card {
            transition: all 0.3s;
            border-left: 5px solid #007bff;
        }

        .order-new {
            animation: flash 1s;
        }

        @keyframes flash {
            0% {
                background-color: #e7f1ff;
            }

            100% {
                background-color: white;
            }
        }
    </style>
</head>

<body class="bg-light">

    <div class="container mt-5">
        <div class="row mb-4">
            <div class="col-12 d-flex justify-content-between align-items-center">
                <h2>🚚 GeoLogistics <small class="text-muted">Dispatcher</small></h2>
                <div>
                    <span id="status-text">Disconnected</span>
                    <span id="status-dot" class="status-dot"></span>
                </div>
            </div>
        </div>

        <div class="card mb-4">
            <div class="card-header bg-dark text-white">1. Connection & Auth</div>
            <div class="card-body">
                <div class="input-group">
                    <span class="input-group-text">Bearer Token</span>
                    <input type="text" id="jwtToken" class="form-control" placeholder="Paste your Login JWT here...">
                    <button class="btn btn-primary" onclick="connect()">Connect WS</button>
                    <button class="btn btn-danger" onclick="disconnect()">Disconnect</button>
                </div>
                <small class="text-muted">This token is sent in the STOMP Connect Headers to pass the Security
                    Interceptor.</small>
            </div>
        </div>

        <div class="row">
            <div class="col-md-4">
                <div class="card">
                    <div class="card-header">2. Actions (REST API)</div>
                    <div class="card-body">
                        <form onsubmit="createOrder(event)">
                            <div class="mb-3">
                                <label>Order Value</label>
                                <input type="number" id="orderValue" class="form-control" value="150.00">
                            </div>
                            <div class="mb-3">
                                <label>Lat / Lon</label>
                                <div class="d-flex gap-2">
                                    <input type="text" id="lat" class="form-control" value="81.1">
                                    <input type="text" id="lon" class="form-control" value="63.1">
                                </div>
                            </div>
                            <button type="submit" class="btn btn-success w-100">Create Order (POST)</button>
                        </form>
                    </div>
                </div>
            </div>

            <div class="col-md-8">
                <div class="card">
                    <div class="card-header d-flex justify-content-between">
                        <span>3. Live Order Feed (WebSocket)</span>
                        <button class="btn btn-sm btn-outline-secondary" onclick="clearLog()">Clear</button>
                    </div>
                    <div class="card-body" style="height: 400px; overflow-y: auto; background: #f8f9fa;">
                        <div id="order-feed">
                            <div class="text-center text-muted mt-5">Waiting for orders...</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let stompClient = null;

        // 1. CONNECT TO WEBSOCKET
        function connect() {
            const token = document.getElementById('jwtToken').value;
            if (!token) { alert("Please paste a JWT Token first!"); return; }

            // Connect to the Endpoint defined in WebSocketConfig
            const socket = new SockJS('http://localhost:8080/ws-registry');
            stompClient = Stomp.over(socket);

            // STOMP Headers (This is where we pass the Token for the Interceptor!)
            const headers = {
                'Authorization': 'Bearer ' + token
            };

            stompClient.connect(headers, function (frame) {
                setConnected(true);
                console.log('Connected: ' + frame);

                // SUBSCRIBE 1: Private User Queue (For specific driver/user alerts)
                // Note: We subscribe to '/user/queue/orders'. Spring auto-maps this to the specific user session.
                stompClient.subscribe('/user/queue/orders', function (message) {
                    showOrder(JSON.parse(message.body), 'Private Alert');
                });

                // SUBSCRIBE 2: Public Topic (Admin dashboard view)
                stompClient.subscribe('/topic/orders', function (message) {
                    showOrder(JSON.parse(message.body), 'Public Broadcast');
                });

            }, function (error) {
                console.error(error);
                setConnected(false);
                alert("Connection Failed! Check console. (Did you disable CORS in Spring?)");
            });
        }

        // 2. DISCONNECT
        function disconnect() {
            if (stompClient !== null) {
                stompClient.disconnect();
            }
            setConnected(false);
            console.log("Disconnected");
        }

        // 3. CREATE ORDER (REST API CALL)
        function createOrder(e) {
            e.preventDefault();
            const token = document.getElementById('jwtToken').value;

            const orderData = {
                orderValue: document.getElementById('orderValue').value,
                destinationLat: document.getElementById('lat').value,
                destinationLon: document.getElementById('lon').value
            };

            fetch('http://localhost:8080/api/orders', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer ' + token
                },
                body: JSON.stringify(orderData)
            })
                .then(response => {
                    if (response.ok) return response.json();
                    throw new Error('API Error');
                })
                .then(data => {
                    console.log("Order Created via REST:", data);
                    // We don't manually add it to the UI here.
                    // We wait for the WebSocket to tell us it happened!
                })
                .catch(err => alert("Failed to create order. Check Token/Console."));
        }

        // UI HELPER FUNCTIONS
        function setConnected(connected) {
            const dot = document.getElementById('status-dot');
            const text = document.getElementById('status-text');
            if (connected) {
                dot.classList.add('status-connected');
                dot.classList.remove('status-error');
                text.innerText = "Live";
            } else {
                dot.classList.remove('status-connected');
                text.innerText = "Disconnected";
            }
        }

        function showOrder(order, source) {
            const feed = document.getElementById('order-feed');
            // Remove empty state text if exists
            if (feed.innerText.includes("Waiting")) feed.innerHTML = "";

            const card = document.createElement('div');
            card.className = 'card mb-2 order-card order-new';
            card.innerHTML = `
            <div class="card-body p-2">
                <div class="d-flex justify-content-between">
                    <h6 class="card-title m-0">Order #${order.id.substring(0, 8)}...</h6>
                    <span class="badge bg-info text-dark">${order.status}</span>
                </div>
                <p class="card-text small text-muted mb-1">
                    Value: ₹${order.orderValue} | Loc: ${order.destinationLat}, ${order.destinationLon}
                </p>
                <span class="badge bg-secondary" style="font-size: 0.6rem">${source}</span>
            </div>
        `;

            // Add to top of list
            feed.insertBefore(card, feed.firstChild);
        }

        function clearLog() {
            document.getElementById('order-feed').innerHTML = '<div class="text-center text-muted mt-5">Waiting for orders...</div>';
        }
    </script>

</body>

</html>
